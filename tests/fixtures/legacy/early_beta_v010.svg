    <path id="core-cross" d="M 370,250 L 430,250 M 400,220 L 400,280" stroke="#00f0ff" stroke-width="1.8" />
    <text id="version-label" x="400" y="80" fill="#ffffff" font-size="20" font-family="sans-serif" text-anchor="middle">EARLY BETA V0.1.0 ASSET</text>
