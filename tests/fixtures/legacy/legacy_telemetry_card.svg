<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="480">
  <style>
    @keyframes sweep {
      0% { transform: rotate(-45deg); }
      100% { transform: rotate(45deg); }
    }
    .needle-anim {
      animation: sweep 3s ease-in-out infinite alternate;
    }
  </style>
  <g inkscape:groupmode="layer" id="layer-metrics">
    <rect id="card-base" width="800" height="480" fill="#0d1117" />
    <circle id="gauge-dial" cx="400" cy="240" r="100" stroke="#30363d" stroke-width="3" fill="none" />
    <path id="gauge-needle" class="needle-anim" d="M 400,240 L 400,160" stroke="#f85149" stroke-width="3" />
    <text id="metric-text" x="400" y="380" fill="#c9d1d9" font-size="22" text-anchor="middle">LEGACY TELEMETRY</text>
  </g>
</svg>
