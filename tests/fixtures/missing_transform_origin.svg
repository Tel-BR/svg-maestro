<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 300"
     width="100%" height="100%">
  <style>
    .anim-spin {
      animation: spin-kf 4s linear infinite;
      transform-box: fill-box;
    }

    @keyframes spin-kf {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <g inkscape:groupmode="layer" id="layer-background" inkscape:label="Background">
    <rect width="500" height="300" fill="#0a0e17" />
  </g>

  <g inkscape:groupmode="layer" id="layer-motion" inkscape:label="Motion">
    <g class="anim-spin">
      <circle cx="250" cy="150" r="40" fill="#00f0ff" />
    </g>
  </g>
</svg>
