<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 300"
     width="100%" height="100%">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <filter id="filter-core-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .anim-spin-wrapper {
      animation: spin-cw 6s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .anim-pulse-wrapper {
      animation: pulse-scale 2s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-scale {
      0% { transform: scale(0.95); opacity: 0.5; }
      100% { transform: scale(1.05); opacity: 1.0; }
    }
  </style>

  <!-- Layer 1: Background -->
  <g inkscape:groupmode="layer" id="layer-background" inkscape:label="Background">
    <rect width="500" height="300" fill="url(#grad-primary)" />
  </g>

  <!-- Layer 2: Grid and Structural Accents -->
  <g inkscape:groupmode="layer" id="layer-grid" inkscape:label="Grid">
    <path d="M 50,250 L 450,250" stroke="#1e293b" stroke-width="1" />
  </g>

  <!-- Layer 3: Motion Wrappers (Isolated from Geometry) -->
  <g inkscape:groupmode="layer" id="layer-motion" inkscape:label="Motion Wrappers">
    <g class="anim-spin-wrapper" id="wrapper-spinner">
      <g id="geom-spinner" inkscape:label="Spinner Geometry">
        <circle cx="250" cy="150" r="40" stroke="#00f0ff" stroke-width="2" fill="none" filter="url(#filter-core-glow)" />
      </g>
    </g>
    <g class="anim-pulse-wrapper" id="wrapper-pulse">
      <g id="geom-pulse" inkscape:label="Pulse Geometry">
        <circle cx="250" cy="150" r="20" fill="#7000ff" />
      </g>
    </g>
  </g>

  <!-- Layer 4: Typography -->
  <g inkscape:groupmode="layer" id="layer-typography" inkscape:label="Typography">
    <text x="50" y="50" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16">VALID FIXTURE</text>
  </g>
</svg>
