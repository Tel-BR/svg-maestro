<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 500 300"
     width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
  </defs>

  <style>
    .direct-spin {
      animation: spin-direct 5s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes spin-direct {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <g inkscape:groupmode="layer" id="layer-background" inkscape:label="Background">
    <rect width="500" height="300" fill="url(#grad-bg)" />
  </g>

  <g inkscape:groupmode="layer" id="layer-shapes" inkscape:label="Shapes">
    <!-- Non-conforming: Animation class attached directly to <circle> instead of wrapper <g> -->
    <circle class="direct-spin" cx="250" cy="150" r="40" fill="#00f0ff" />
  </g>
</svg>
