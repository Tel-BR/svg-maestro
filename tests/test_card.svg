<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 400 240"
     width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="grad-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="grad-neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Radar Pulse Filter -->
    <filter id="filter-radar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animation Contract: transform-box and transform-origin are mandatory */
    .anim-radar-spin {
      animation: spin-radar 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .anim-pulse-breath {
      animation: breath-pulse 3s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: center;
    }

    .anim-dash-trace {
      stroke-dasharray: 60, 20;
      animation: trace-dash 4s linear infinite;
    }

    @keyframes spin-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes breath-pulse {
      0% { opacity: 0.3; transform: scale(0.96); }
      100% { opacity: 0.9; transform: scale(1.04); }
    }

    @keyframes trace-dash {
      to { stroke-dashoffset: -80; }
    }
  </style>

  <!-- Layer 1: Background & Card Base -->
  <g inkscape:groupmode="layer" id="layer-card-base" inkscape:label="Card Base">
    <rect x="2" y="2" width="396" height="236" rx="16" fill="url(#grad-card-bg)" stroke="#1e293b" stroke-width="2" />
    <circle cx="340" cy="60" r="120" fill="#00f0ff" opacity="0.03" />
  </g>

  <!-- Layer 2: Grid & Framing Geometry -->
  <g inkscape:groupmode="layer" id="layer-geometric-grid" inkscape:label="Geometric Grid">
    <path d="M 30,190 L 370,190" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 30,140 L 370,140" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <rect x="24" y="24" width="8" height="8" fill="#00f0ff" opacity="0.8" />
  </g>

  <!-- Layer 3: Animated Motion Wrappers (Wrapper Pattern) -->
  <g inkscape:groupmode="layer" id="layer-animated-core" inkscape:label="Animated Elements">
    <!-- Wrapper 1: Continuous Radar Sweep -->
    <g class="anim-radar-spin">
      <g id="geom-radar-sweep" inkscape:label="Radar Geometry">
        <circle cx="320" cy="70" r="38" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" />
        <line x1="320" y1="70" x2="358" y2="70" stroke="url(#grad-neon-cyan)" stroke-width="2" filter="url(#filter-radar-glow)" />
      </g>
    </g>

    <!-- Wrapper 2: Pulsing Accent Ring -->
    <g class="anim-pulse-breath">
      <g id="geom-pulse-ring" inkscape:label="Pulsing Ring Geometry">
        <circle cx="320" cy="70" r="48" fill="none" stroke="#7000ff" stroke-width="1" stroke-opacity="0.5" />
      </g>
    </g>

    <!-- Wrapper 3: Traced Metric Line -->
    <g id="geom-traced-path" inkscape:label="Traced Data Path">
      <path class="anim-dash-trace" d="M 30,170 Q 120,120 200,150 T 370,100" fill="none" stroke="url(#grad-neon-cyan)" stroke-width="2.5" filter="url(#filter-radar-glow)" />
    </g>
  </g>

  <!-- Layer 4: Static Content & Labels (Edit-Safe in Inkscape) -->
  <g inkscape:groupmode="layer" id="layer-content" inkscape:label="Card Content">
    <text x="44" y="32" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">TELEMETRY NEXUS</text>
    <text x="30" y="96" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">99.98%</text>
    <text x="30" y="122" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="500" fill="#00f0ff">LIVE VECTOR STREAMING</text>
  </g>
</svg>
